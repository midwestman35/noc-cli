[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noc-cli"
version = "0.5.0"
description = "Read-only NOC triage assistant for Carbyne APEX NG911/E911 (Python / Claude Agent SDK)."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.1.0",
    "textual>=0.60",
    "mcp>=1.0",
]

[project.scripts]
noc-cli = "noc_cli.cli:app"
noc-cli-zendesk-mcp = "noc_cli.mcp.zendesk_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "anyio>=4.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["noc_cli"]

[tool.hatch.build.targets.wheel.force-include]
"noc_cli/data" = "noc_cli/data"
"noc_cli/runbooks" = "noc_cli/runbooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: spawns the stdio MCP server subprocess"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (defaults); I = isort; UP = pyupgrade
select = ["E", "F", "I", "UP"]
# E501 (line-too-long): the formatter owns line length — it wraps what it can
# safely restructure and leaves long strings/URLs/comments intact. Flagging the
# residue as a lint error is noise on an existing codebase, so ignore it.
ignore = ["E501"]

[tool.ruff.format]
# Match the existing style: double quotes, spaces, trailing commas honored.
quote-style = "double"
