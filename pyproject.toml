[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noc-cli"
version = "0.1.0"
description = "Read-only NOC triage assistant for Carbyne APEX NG911/E911 (Python / Claude Agent SDK)."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.1.0",
    "textual>=0.60",
]

[project.scripts]
noc-cli = "noc_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["noc_cli"]

[tool.hatch.build.targets.wheel.force-include]
"noc_cli/data" = "noc_cli/data"
"noc_cli/runbooks" = "noc_cli/runbooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
